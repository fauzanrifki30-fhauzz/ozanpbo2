
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Sistem PBO</title>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    background: #f4f6f9;
    margin: 0;
    color: #333;
}
nav {
    background: #2c3e50;
    color: white;
    padding: 18px;
    display: none;
    justify-content: space-between;
}
nav button {
    padding: 9px;
    cursor: pointer;
}
.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px #ccc;
}
.page { display: none; }
.active { display: block; }
.form-group { margin-bottom: 15px; }
label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}
input, select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
.btn {
    padding: 9px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin: 3px;
}
.primary { background: #3498db; color: white; }
.success { background: #2ecc71; color: white; }
.danger { background: #e74c3c; color: white; }
.warning { background: #f1c40f; }
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}
th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}
th { background: #f1f1f1; }
.badge {
    padding: 5px 8px;
    color: white;
    border-radius: 4px;
}
.admin { background: #e74c3c; }
.standard { background: #27ae60; }
.profile-card {
    padding: 20px;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 8px;
}
@media(max-width:650px) {
    nav { flex-direction: column; gap: 10px; }
    .container { margin: 15px; overflow-x: auto; }
    #userForm > div { flex-direction: column; }
}
</style>
</head>
<body>

<nav id="navbar">
    <h3>Sistem Kelola User (PBO)</h3>
    <div>
        <button onclick="showPage('page-users')">Daftar User</button>
        <button onclick="showPage('page-profile')">Profil Saya</button>
        <button onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">

<!-- LOGIN -->
<div id="page-login" class="page active">
    <h2>Login Sistem</h2>
    <hr><br>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUsername" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required>
        </div>

        <button class="btn primary" style="width:100%">
            Login
        </button>
    </form>

    <br>
    <p>Admin: <b>admin / admin123</b></p>
    <p>User: <b>user / user123</b></p>
</div>

<!-- MANAJEMEN USER -->
<div id="page-users" class="page">
    <h2>Manajemen Data User</h2>
    <hr><br>

    <form id="userForm" onsubmit="handleSaveUser(event)">
        <input type="hidden" id="userId">

        <div style="display:flex;gap:10px">
            <div class="form-group" style="flex:1">
                <label>Username</label>
                <input type="text" id="userName" required>
            </div>

            <div class="form-group" style="flex:1">
                <label>Email</label>
                <input type="email" id="userEmail" required>
            </div>

            <div class="form-group" style="flex:1">
                <label>Role</label>
                <select id="userRole">
                    <option value="Admin">Admin</option>
                    <option value="Standard">Standard User</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn success" id="btnSubmit">
            Tambah User
        </button>
        <button type="button" class="btn warning" onclick="resetForm()">
            Batal
        </button>
    </form>

    <br><hr>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>
</div>

<!-- PROFILE -->
<div id="page-profile" class="page">
    <h2>Profil Pengguna</h2>
    <hr><br>

    <div class="profile-card">
        <h3 id="profName"></h3>
        <p>Email: <span id="profEmail"></span></p>
        <p>Role: <span id="profRole"></span></p>
        <br>
        <b>Hak Akses:</b>
        <p id="profPermissions"></p>
    </div>
</div>

</div>

<script>
// CLASS PARENT
class User {
    constructor(id, username, email, role) {
        this.id = id;
        this.username = username;
        this.email = email;
        this.role = role;
    }

    getRoleBadge() {
        return this.role;
    }

    getPermissions() {
        return "Akses standar sistem";
    }
}

// CLASS ADMIN
class AdminUser extends User {
    constructor(id, username, email) {
        super(id, username, email, "Admin");
    }

    getRoleBadge() {
        return '<span class="badge admin">ADMINISTRATOR</span>';
    }

    getPermissions() {
        return "Full Control: Dapat menambah, mengubah dan menghapus data user.";
    }
}

// CLASS STANDARD
class StandardUser extends User {
    constructor(id, username, email) {
        super(id, username, email, "Standard");
    }

    getRoleBadge() {
        return '<span class="badge standard">STANDARD USER</span>';
    }

    getPermissions() {
        return "Read Only: Hanya dapat melihat data dan profil sendiri.";
    }
}

// FACTORY PATTERN
function createUser(data) {
    if (data.role === "Admin") {
        return new AdminUser(data.id, data.username, data.email);
    }
    return new StandardUser(data.id, data.username, data.email);
}

// AKUN LOGIN
const accounts = {
    admin: "admin123",
    user: "user123"
};

let currentUser = null;

// LOCAL STORAGE
function initStorage() {
    if (!localStorage.getItem("usersData")) {
        const initialUsers = [
            {
                id: 1,
                username: "admin",
                email: "admin@app.com",
                role: "Admin"
            },
            {
                id: 2,
                username: "user",
                email: "user@app.com",
                role: "Standard"
            }
        ];

        localStorage.setItem(
            "usersData",
            JSON.stringify(initialUsers)
        );
    }
}

function getUsers() {
    return JSON.parse(
        localStorage.getItem("usersData") || "[]"
    ).map(createUser);
}

function saveUsers(users) {
    localStorage.setItem(
        "usersData",
        JSON.stringify(users)
    );
}

// NAVIGASI
function showPage(pageId) {
    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById(pageId).classList.add("active");

    if (pageId === "page-users") renderTable();
    if (pageId === "page-profile") renderProfile();
}

// LOGIN
function handleLogin(event) {
    event.preventDefault();

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    const users = getUsers();
    const foundUser = users.find(u => u.username === username);

    if (foundUser && accounts[username] === password) {
        currentUser = foundUser;

        document.getElementById("navbar").style.display = "flex";

        showPage("page-users");
    } else {
        alert("Username atau password salah!");
    }
}

// LOGOUT
function logout() {
    currentUser = null;

    document.getElementById("navbar").style.display = "none";
    document.querySelector("form").reset();

    showPage("page-login");
}

// TABEL USER
function renderTable() {
    const tbody = document.getElementById("userTableBody");
    tbody.innerHTML = "";

    getUsers().forEach(user => {
        const tr = document.createElement("tr");

        const isAdmin = currentUser.role === "Admin";

        tr.innerHTML = `
            <td>${user.id}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>${user.getRoleBadge()}</td>
            <td>
                ${isAdmin ? `
                <button class="btn warning"
                    onclick="editUser(${user.id})">Edit</button>
                <button class="btn danger"
                    onclick="deleteUser(${user.id})">Hapus</button>
                ` : "Read Only"}
            </td>
        `;

        tbody.appendChild(tr);
    });

    document.getElementById("userForm").style.display =
        currentUser.role === "Admin" ? "block" : "none";
}

// TAMBAH DAN EDIT
function handleSaveUser(event) {
    event.preventDefault();

    if (currentUser.role !== "Admin") return;

    const id = document.getElementById("userId").value;
    const username = document.getElementById("userName").value.trim();
    const email = document.getElementById("userEmail").value.trim();
    const role = document.getElementById("userRole").value;

    let users = getUsers();

    if (users.some(u => u.username === username && u.id != id)) {
        alert("Username sudah digunakan!");
        return;
    }

    if (id) {
        users = users.map(u =>
            u.id == id
                ? createUser({ id: Number(id), username, email, role })
                : u
        );
    } else {
        const newId = users.length
            ? Math.max(...users.map(u => u.id)) + 1
            : 1;

        users.push(createUser({
            id: newId,
            username,
            email,
            role
        }));
    }

    saveUsers(users);
    resetForm();
    renderTable();
}

// EDIT
function editUser(id) {
    if (currentUser.role !== "Admin") return;

    const user = getUsers().find(u => u.id === id);
    if (!user) return;

    document.getElementById("userId").value = user.id;
    document.getElementById("userName").value = user.username;
    document.getElementById("userEmail").value = user.email;
    document.getElementById("userRole").value = user.role;

    document.getElementById("btnSubmit").textContent = "Update User";
}

// HAPUS
function deleteUser(id) {
    if (currentUser.role !== "Admin") return;

    if (id === currentUser.id) {
        alert("Tidak dapat menghapus akun yang sedang digunakan!");
        return;
    }

    if (confirm("Yakin ingin menghapus user ini?")) {
        const users = getUsers().filter(u => u.id !== id);
        saveUsers(users);
        renderTable();
    }
}

// RESET FORM
function resetForm() {
    document.getElementById("userForm").reset();
    document.getElementById("userId").value = "";
    document.getElementById("btnSubmit").textContent = "Tambah User";
}

// PROFIL
function renderProfile() {
    if (!currentUser) return;

    document.getElementById("profName").textContent =
        currentUser.username;

    document.getElementById("profEmail").textContent =
        currentUser.email;

    document.getElementById("profRole").innerHTML =
        currentUser.getRoleBadge();

    document.getElementById("profPermissions").textContent =
        currentUser.getPermissions();
}

// JALANKAN
initStorage();
</script>

</body>
</html>
